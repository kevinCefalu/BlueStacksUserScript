name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted;
          Install-Module InvokeBuild -Force -Scope CurrentUser -ErrorAction Stop;
          Install-Module Pester -Force -Scope CurrentUser -MinimumVersion 5.0 -ErrorAction Stop;
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop;

      - name: Lint
        shell: pwsh
        run: ./build.ps1 -Task Lint

      - name: Test
        shell: pwsh
        run: ./build.ps1 -Task Test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-pwsh
          path: output/testResults.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-pwsh
          path: output/coverage.xml

  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - test

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted;
          Install-Module InvokeBuild -Force -Scope CurrentUser -ErrorAction Stop;
          Install-Module Pester -Force -Scope CurrentUser -MinimumVersion 5.0 -ErrorAction Stop;
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop;

      - name: Build
        shell: pwsh
        run: ./build.ps1 -Task Build

      # upload the built module as an artifact and release for this repository
      - name: Upload built module
        uses: actions/upload-artifact@v4
        with:
          name: built-module
          path: output/BlueStacksUserScript/

  release:
    name: Auto-tag & Release
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs:
      - build

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main